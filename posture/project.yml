name: Posture
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  Posture:
    build:
      targets:
        Posture: all
        PostureTests: [test]
    test:
      targets:
        - PostureTests
    run:
      config: Debug

targets:
  Posture:
    type: application
    platform: iOS
    sources:
      - path: Posture
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.posture
        INFOPLIST_FILE: Posture/Info.plist
        CODE_SIGN_ENTITLEMENTS: Posture/Posture.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  PostureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PostureTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.posture.tests
    dependencies:
      - target: Posture
